name: CI Health Check

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: true
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
      VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      E2E_BASE_URL: http://127.0.0.1:5173
      MATCHMAKING_CRON_SECRET: ci-health-check

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run unit tests
        run: npm run test:unit

      - name: Run i18n audit
        run: npm run i18n:audit

      - name: Run production build
        run: npm run build

      - name: Check Firebase browser env availability
        id: firebase_env
        shell: bash
        run: |
          if [ -n "$VITE_FIREBASE_API_KEY" ] && [ -n "$VITE_FIREBASE_AUTH_DOMAIN" ] && [ -n "$VITE_FIREBASE_PROJECT_ID" ] && [ -n "$VITE_FIREBASE_APP_ID" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Firebase public secrets missing; browser smoke steps will be skipped."
          fi

      - name: Start local app
        if: steps.firebase_env.outputs.available == 'true'
        shell: bash
        run: |
          npm run dev > ci-dev.log 2>&1 &
          echo $! > ci-dev.pid
          npx wait-on http://127.0.0.1:5173/login

      - name: Run public smoke tests
        if: steps.firebase_env.outputs.available == 'true'
        run: npm run test:e2e -- tests/google-review-public.spec.js

      - name: Run authenticated smoke tests
        if: steps.firebase_env.outputs.available == 'true'
        shell: bash
        run: |
          if [ -n "$E2E_EMAIL" ] && [ -n "$E2E_PASSWORD" ]; then
            npm run test:e2e -- tests/matchmaking-apply-wizard.smoke.spec.js tests/matchmaking.smoke.spec.js
          else
            echo "E2E_EMAIL / E2E_PASSWORD missing; authenticated smoke tests skipped."
          fi

      - name: Stop local app
        if: always() && steps.firebase_env.outputs.available == 'true'
        shell: bash
        run: |
          if [ -f ci-dev.pid ]; then
            kill $(cat ci-dev.pid) || true
          fi

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report
            test-results
            ci-dev.log
          if-no-files-found: ignore
