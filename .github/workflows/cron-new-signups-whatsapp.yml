name: Cron - New Signups WhatsApp
"on":
  schedule:
    # Her 5 dakikada bir (GitHub schedule gecikmeli çalışabilir)
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call notify endpoint
        env:
          BASE_URL: ${{ secrets.CRON_BASE_URL }}
          CRON_SECRET: ${{ secrets.MATCHMAKING_CRON_SECRET }}
        run: |
          if [ -z "$BASE_URL" ]; then
            BASE_URL="https://uniqah.com"
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "MATCHMAKING_CRON_SECRET GitHub secret eksik" >&2
            exit 1
          fi

          URL="$BASE_URL/api/admin-new-signups-whatsapp-notify"
          echo "POST $URL"

          curl -sS -X POST "$URL" \
            -H "Content-Type: application/json" \
            -H "X-Cron-Secret: $CRON_SECRET" \
            --data '{}' \
            --fail-with-body

          echo ""
